      padding: 0;

      padding: 14px 0;

      background-color: #f8fafc;
    }

    .sub-tabs {
      display: flex;

      margin-bottom: 15px;

    .sub-btn {

      border-radius: 6px;
      font-weight: bold;

      font-size: 0.95rem;

    .btn-reset {
      background-color: #94a3b8;

      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;

      right: 0;
      background: #ffffff;

      cursor: pointer;

          { q: "【国風】紫式部によって書かれた、貴族社会を描いた長編物語。", a: "源氏物語", exp: "かな文字の発達により文芸が盛んになりました。清少納言の『枕草子』も有名です。" },

          { q: "【鎌倉】東大寺南大門に置かれた、運慶・快慶らによって作られた力強い彫刻。", a: "金剛力士像", exp: "鎌倉時代の力強い彫刻芸術です。時宗（一遍）や浄土宗（法然）など新仏教も広がりました。" },

          { q: "【桃山】「わび茶」の作法を完成させた、信長や秀吉に仕えた茶人。", a: "千利休", exp: "豪華な桃山文化（狩野永徳の屏風画など）の中で質素な美を追究しました。" },
          { q: "【桃山】京の町で「かぶき踊り」を始め、後の歌舞伎の原点となった人物。", a: "出雲の阿国", exp: "ヨーロッパからの「南蛮文化」（パン、カステラ等）もこの時代に流行しました。" },

          { q: "【大正】プロレタリア文学の代表作『蟹工船』を著した作家。", a: "小林多喜二", exp: "新聞・ラジオ等のメディア普及に伴い大衆文化が成熟。芥川龍之介や白樺派も活躍しました。" },
          { q: "【昭和】大衆娯楽として都市部で一般家庭に急速に普及した音声放送。", a: "ラジオ放送", exp: "1925年に放送が開始され、新聞とともに多くの人々へ情報や娯楽を届けました。" },
          { q: "【昭和】大正から昭和初期にかけて江戸川乱歩らが人気を博した文学ジャンル。", a: "探偵小説", exp: "社会科学や大衆文学、映画・スポーツなど、都市を中心に大衆文化が大きく広がりました。" }

    let currentSetKey = 'no1';
    let selectedBox = null;

    function formatQuestionText(text) {
      return text.replace(/【(.*?)】/g, (match, era) => {
        return `<span class="era-tag era-${era}">${era}</span>`;
      });
    }

    function loadSet(key) {
      currentSetKey = key;
      const data = personQuestionsData[key];
      
      document.querySelectorAll('.sub-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', 
          (key==='no1'&&idx===0) || 
          (key==='no2'&&idx===1) || 
          (key==='no3'&&idx===2) || 
          (key==='no4'&&idx===3) || 
          (key==='no5'&&idx===4)
        );
      });

      document.getElementById('section-title').textContent = data.title;

      const container = document.getElementById('questions-container');
      container.innerHTML = '';

      data.list.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        
        const formattedQ = formatQuestionText(item.q);

        card.innerHTML = `
          <div>
            <span class="q-number">${index + 1}</span>
            <span>${formattedQ}</span>
            <span class="blank-box" id="blank-${index}" onclick="selectBlank(${index})">（   ）</span>
          </div>
          <div class="explanation" id="exp-${index}">💡 <strong>解説:</strong> ${item.exp}</div>
        `;
        container.appendChild(card);
      });

      const tagsContainer = document.getElementById('word-tags');
      tagsContainer.innerHTML = '';
      
      const answers = data.list.map(i => i.a);
      const shuffled = [...answers].sort(() => Math.random() - 0.5);

      shuffled.forEach(word => {
        const tag = document.createElement('span');
        tag.className = 'word-tag';
        tag.textContent = word;
        tag.onclick = () => fillAnswer(word);
        tagsContainer.appendChild(tag);
      });
    }

    function selectBlank(index) {
      if (selectedBox) {
        selectedBox.style.backgroundColor = '#f1f5f9';
      }
      selectedBox = document.getElementById(`blank-${index}`);
      selectedBox.style.backgroundColor = '#fde047';
    }

    function fillAnswer(word) {
      if (selectedBox) {
        selectedBox.textContent = word;
        selectedBox.style.backgroundColor = '#f1f5f9';
        selectedBox = null;
      } else {
        const emptyBox = Array.from(document.querySelectorAll('.blank-box')).find(b => b.textContent === '（   ）');
        if (emptyBox) {
          emptyBox.textContent = word;
        }
      }
    }

    function checkAnswers() {
      const data = personQuestionsData[currentSetKey].list;
      data.forEach((item, index) => {
        const box = document.getElementById(`blank-${index}`);
        const exp = document.getElementById(`exp-${index}`);
        const userAns = box.textContent.trim();

        if (userAns === item.a) {
          box.style.color = '#15803d';
          box.style.borderBottom = '3px solid #15803d';
        } else {
          box.style.color = '#b91c1c';
          box.style.borderBottom = '3px solid #b91c1c';
          box.textContent = `${userAns} (正: ${item.a})`;
        }
        exp.style.display = 'block';
      });
    }

    function resetForm() {
      loadSet(currentSetKey);
    }

    window.onload = () => {
      loadSet('no1');
    };
  </script>
